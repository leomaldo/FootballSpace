<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Equipos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #ece9e6, #ffffff);
        }

        h1 {
            color: #4CAF50;
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
        }

        .list-container {
            background-color: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 90%;
            max-width: 600px;
        }

        .list-container h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 15px;
            margin-bottom: 10px;
            background-color: #f9f9f9;
            border-radius: 8px;
            box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        li:hover {
            background-color: #f1f1f1;
            transform: translateY(-3px);
        }

        li h2 {
            margin: 0;
            font-size: 1.2rem;
            color: #555;
        }

        li .stadium-name {
            font-size: 0.9rem;
            color: #777;
            margin-top: 5px;
        }

        li .badge {
            background-color: #4CAF50;
            color: white;
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: bold;
            align-self: flex-end;
        }

        .button-container {
            margin-top: 20px;
        }

        .button-container button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            background-color: #4CAF50;
            border: none;
            border-radius: 8px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .button-container button:hover {
            background-color: #45a049;
            transform: translateY(-3px);
        }

        .button-container button i {
            margin-right: 10px;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

<h1>Futbol Space</h1>
<div class="list-container">
    <h2>Lista de Equipos</h2>
    <ul>
        #{list items:teams, as:'teams'}
        <li>
            <h2>${teams.name}</h2>
            <p class="stadium-name">${teams.name_stadium}</p>
            <span class="badge">Nuevo</span>
        </li>
        #{/list}
    </ul>
    <div class="button-container">
        <button onclick="location.href='@{Application.index()}'">
            <i class="fas fa-home"></i> Tornar a la pàgina principal
        </button>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Partidos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #ece9e6, #ffffff);
        }

        h1 {
            color: #4CAF50;
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
        }

        .list-container {
            background-color: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 90%;
            max-width: 600px;
        }

        .list-container h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        li {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 20px; /* Increased padding */
            margin-bottom: 15px; /* Increased margin */
            background-color: #f9f9f9;
            border-radius: 8px;
            box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            position: relative;
            width: 100%; /* Ensure the container takes full width */
        }

        li:hover {
            background-color: #f1f1f1;
            transform: translateY(-3px);
        }

        li h2 {
            margin: 0;
            font-size: 1.5rem; /* Increased font size */
            color: #555;
        }

        li .details {
            position: absolute;
            bottom: -20px;
            left: 20px; /* Adjusted position */
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px; /* Increased padding */
            border-radius: 8px;
            font-size: 1rem; /* Increased font size */
            font-weight: bold;
            display: none;
            box-shadow: 0px 2px 4px rgba(0, 0, 0, 0.2);
        }

        li:hover .details {
            display: block;
        }

        .button-container {
            margin-top: 20px;
        }

        .button-container button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 20px;
            font-size: 16px;
            color: white;
            background-color: #4CAF50;
            border: none;
            border-radius: 8px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .button-container button:hover {
            background-color: #45a049;
            transform: translateY(-3px);
        }

        .button-container button i {
            margin-right: 10px;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

<h1>Futbol Space</h1>
<div class="list-container">
    <h2>Lista de Partidos</h2>
    <ul>
        #{list items:matches, as:'matches'}
        <li>
            <h2>${matches.teams.name}</h2>
            <div class="details">Fecha: ${matches.data} <br> Ciudad: ${matches.city}</div>
        </li>
        #{/list}
    </ul>
    <div class="button-container">
        <button onclick="location.href='@{Application.index()}'">
            <i class="fas fa-home"></i> Tornar a la pàgina principal
        </button>
    </div>
</div>

</body>
</html>
